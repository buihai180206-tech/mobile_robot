#     position_feedback: false          # URDF có cả position và velocity; ở đây tính odom
#                                       # từ velocity
#     velocity_rolling_window_size: 10  # lấy trung bình 10 mẫu cho odom bớt nhiễu

#     # ---- Khung toạ độ TF/odom: phải là các frame CÓ THẬT trong URDF ----
#     odom_frame_id: odom               # odom chỉ tồn tại nhờ controller này phát ra
#     base_frame_id: base_footprint     # gốc của URDF (my_robot.urdf.xacro dòng <link name="base_footprint"/>)
#     enable_odom_tf: true              # tự phát TF  odom -> base_footprint

#     publish_rate: 50.0                # Hz, phải <= update_rate ở trên (100 Hz)

#     # ---- AN TOÀN: quá cmd_vel_timeout giây không nhận lệnh mới thì controller PHANH ----
