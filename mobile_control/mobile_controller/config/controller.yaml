#     right_wheel_names: ["right_wheel_joint"]

#     # ---- Động học của robot: BẮT BUỘC phải khớp với URDF ----
#     # wheel_separation = 0.225 * 2, tính từ URDF:
#     #   bánh trái: y = +(base_width + wheel_length)/2 = +(0.4 + 0.05)/2 = +0.225
#     #   bánh phải: y = -0.225   => khoảng cách tâm 2 bánh = 0.45 m
#     wheel_separation: 0.45
#     wheel_radius: 0.1                 # = xacro:property wheel_radius trong my_robot.urdf.xacro

#     wheel_separation_multiplier: 1.0
#     left_wheel_radius_multiplier: 1.0
#     right_wheel_radius_multiplier: 1.0

#     # ---- Nguồn dữ liệu để tính odom ----
#     open_loop: false                  # false = ĐÓNG VÒNG: dùng state_interface velocity
