- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS


# ================================ [SỬA] ĐÃ BỎ BRIDGE ==================================
# 4 bridge dưới đây ĐÃ BỎ vì không còn tác dụng (và sẽ gây TRÙNG DỮ LIỆU nếu bật lại):
#
#  1) /cmd_vel (ROS_TO_GZ): trước đây dùng để đưa lệnh cho plugin
#     gz-sim-diff-drive-system. Nhưng plugin đó nằm trong file mobile_base_gazebo.xacro
#     KHÔNG được include vào my_robot.urdf.xacro, nên bên Gazebo KHÔNG có ai nghe
#     /cmd_vel => bridge này là "dây dẫn tới hư không".
#     Từ nay lệnh đi HOÀN TOÀN trong ROS 2:  /diff_drive_controller/cmd_vel
#
#  2) /odom (GZ_TO_ROS): Gazebo không phát topic này (không bật plugin diff drive).
#     Odom chuẩn bây giờ do diff_drive_controller phát: /diff_drive_controller/odom
#
#  3) /joint_states: topic gz "/world/empty/model/my_mobilerobot/joint_state" KHÔNG
#     tồn tại (plugin gz-sim-joint-state-publisher-system bị bỏ). /joint_states chuẩn
#     do joint_state_broadcaster phát. Nếu giữ bridge này mà vẫn bật plugin gz kia thì
#     sẽ có 2 nguồn cùng ghi /joint_states => TF bánh xe bị giật.
#
#  4) /tf (GZ_TO_ROS): Gazebo không phát /tf. TF chuẩn do 2 nguồn ROS 2 phát:
#        - robot_state_publisher  : các khớp trong URDF (base_footprint -> base_link ...)
#        - diff_drive_controller   : odom -> base_footprint
#     Nếu vẫn bridge, khi Gazebo phát /tf sẽ trùng với 2 nguồn trên.
#
# Muốn dùng lại bridge nào thì chỉ cần bỏ dấu # ở khối tương ứng.
#
# - ros_topic_name: "/cmd_vel"
#   gz_topic_name: "/cmd_vel"
#   ros_type_name: "geometry_msgs/msg/Twist"
#   gz_type_name: "gz.msgs.Twist"
#   direction: ROS_TO_GZ
#
# - ros_topic_name: "/odom"
#   gz_topic_name: "/odom"
#   ros_type_name: "nav_msgs/msg/Odometry"
#   gz_type_name: "gz.msgs.Odometry"
#   direction: GZ_TO_ROS
#
# - ros_topic_name: "/joint_states"
#   gz_topic_name: "/world/empty/model/my_mobilerobot/joint_state"
#   ros_type_name: "sensor_msgs/msg/JointState"
#   gz_type_name: "gz.msgs.Model"
#   direction: GZ_TO_ROS
#
# - ros_topic_name: "/tf"
#   gz_topic_name: "/tf"
#   ros_type_name: "tf2_msgs/msg/TFMessage"
#   gz_type_name: "gz.msgs.Pose_V"
#   direction: GZ_TO_ROS
# =====================================================================================

